<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALLdata, anteprima della nuova struttura</title>
  <meta name="description" content="Anteprima interattiva della nuova struttura dello shop ALLdata. Contenuti di esempio.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Vai al contenuto</a>

  <!-- Barra di controllo dell'anteprima: NON fa parte del tema Shopify -->
  <div class="preview-bar" role="region" aria-label="Controlli dell'anteprima">
    <div class="preview-bar__inner">
      <strong class="preview-bar__title">Anteprima ALLdata</strong>
      <div class="segmented" role="radiogroup" aria-label="Struttura da mostrare">
        <label><input type="radio" name="mode" value="current"><span>Struttura attuale</span></label>
        <label><input type="radio" name="mode" value="proposed"><span>Struttura proposta</span></label>
      </div>
      <button type="button" class="btn btn--small" id="toggle-structure" aria-pressed="false">Modalità struttura</button>
      <a class="btn btn--small btn--ghost" id="summary-link" href="#/__struttura">Riepilogo struttura</a>
    </div>
    <p class="preview-bar__note">Modelli, specifiche e associazioni marchio/categoria sono <span class="badge-ex">ESEMPIO</span>. Nessun prezzo reale. Immagini segnaposto.</p>
  </div>

  <div id="announcement"></div>
  <div id="header"></div>
  <main id="main" tabindex="-1"></main>
  <div id="footer"></div>

  <aside id="structure-panel" class="structure-panel" aria-label="Modalità struttura" hidden></aside>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:1rem">Questa anteprima richiede JavaScript.</p></noscript>
  <script src="data/structure.js"></script>
  <script src="data/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
